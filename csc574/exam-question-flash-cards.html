<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSC 574 | Exam Question Flash Cards</title>
    <style>
        :root {
            --ink: #152b3a;
            --muted: #60717b;
            --paper: #f4f1e8;
            --card: #fffdf7;
            --line: #d8d6ca;
            --coral: #d95d4f;
            --teal: #187f7b;
            --gold: #e3a72f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: "Avenir Next", "Trebuchet MS", sans-serif;
            line-height: 1.6;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            content: "";
            opacity: .42;
            background-image: linear-gradient(135deg, rgba(24, 127, 123, .08) 25%, transparent 25%), linear-gradient(315deg, rgba(217, 93, 79, .06) 25%, transparent 25%);
            background-position: 0 0, 18px 18px;
            background-size: 36px 36px;
        }

        .page {
            width: min(960px, calc(100% - 36px));
            margin: 0 auto;
            padding: 30px 0 64px;
        }

        nav {
            margin-bottom: 48px;
            font-size: .8rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        a {
            color: var(--teal);
        }

        h1,
        h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 400;
            line-height: 1.08;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(2.3rem, 5vw, 4rem);
        }

        h2 {
            margin: 38px 0 16px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            color: var(--teal);
            font-size: 2rem;
        }

        .lede {
            max-width: 760px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .rule {
            width: 88px;
            height: 5px;
            margin: 34px 0 42px;
            background: var(--coral);
        }

        .flashcard-section {
            max-width: 760px;
            margin: 0 auto;
        }

        .flashcard {
            display: block;
            width: 100%;
            min-height: 260px;
            padding: 34px;
            border: 1px solid var(--line);
            border-top: 5px solid var(--gold);
            color: var(--ink);
            background: var(--card);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .flashcard:hover,
        .flashcard:focus-visible {
            border-color: var(--gold);
            box-shadow: 8px 8px 0 rgba(21, 43, 58, .12);
            outline: none;
        }

        .flashcard-label {
            display: block;
            margin-bottom: 12px;
            color: var(--gold);
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .flashcard-answer {
            display: none;
            color: var(--muted);
        }

        .flashcard-answer strong {
            font-weight: 400;
        }

        .flashcard-answer ul,
        .flashcard-answer ol {
            margin: 0;
            padding-left: 24px;
        }

        .flashcard-answer li+li {
            margin-top: 6px;
        }

        .flashcard-answer ul,
        .flashcard-answer ol {
            margin: 0;
            padding-left: 24px;
        }

        .flashcard-answer li+li {
            margin-top: 6px;
        }

        .flashcard.is-revealed .flashcard-question {
            display: none;
        }

        .flashcard.is-revealed .flashcard-answer {
            display: block;
        }

        .card-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
        }

        .card-controls button {
            padding: 10px 16px;
            border: 1px solid var(--teal);
            color: var(--teal);
            background: var(--card);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .card-controls button:hover,
        .card-controls button:focus-visible {
            color: #fff;
            background: var(--teal);
            outline: none;
        }

        .card-controls button:disabled {
            border-color: var(--line);
            color: var(--muted);
            background: transparent;
            cursor: not-allowed;
        }

        .position {
            color: var(--muted);
            font-size: .82rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        @media(max-width:700px) {
            .page {
                width: min(100% - 28px, 560px);
                padding-top: 16px;
            }

            .flashcard {
                min-height: 240px;
                padding: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <nav><a href="index.html">Back to course materials</a> · <a
                href="exam%20questions/CSC574_possible_exam_questions.html">Exams Guide</a> · <a
                href="exam%20questions/CSC574_exams_guide_answers.html">Exams Guide Answers</a></nav>
        <main>
            <h1>Exam Question Flash Cards</h1>
            <p class="lede">Practice every Learning Objective and example task from the instructor-provided Exams Guide.
                Select a card to reveal its matching answer.</p>
            <div class="rule"></div>
            <section class="flashcard-section">
                <h2>Exam Questions</h2>
                <div id="card" class="flashcard" role="button" tabindex="0" aria-expanded="false"><span id="label"
                        class="flashcard-label">Question</span><span id="question" class="flashcard-question">Loading
                        exam questions...</span><span id="answer" class="flashcard-answer"></span></div>
                <div class="card-controls"><button id="previous" type="button">Previous</button><span id="position"
                        class="position" aria-live="polite"></span><button id="next" type="button">Next</button></div>
            </section>
        </main>
    </div>
    <script>
        let current = 0;
        const card = document.querySelector('#card');
        const label = document.querySelector('#label');
        const question = document.querySelector('#question');
        const answer = document.querySelector('#answer');
        const position = document.querySelector('#position');
        const previous = document.querySelector('#previous');
        const next = document.querySelector('#next');
        let cards = [];
        function render() {
            question.textContent = cards[current].question;
            answer.innerHTML = cards[current].answer;
            position.textContent = `Card ${current + 1} of ${cards.length}`;
            label.textContent = 'Question';
            card.classList.remove('is-revealed');
            card.setAttribute('aria-expanded', 'false');
            previous.disabled = current === 0;
            next.disabled = current === cards.length - 1;
        }
        function reveal() { const isRevealed = card.classList.toggle('is-revealed'); card.setAttribute('aria-expanded', String(isRevealed)); label.textContent = isRevealed ? 'Answer' : 'Question'; }
        card.addEventListener('click', reveal);
        card.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); reveal(); } });
        previous.addEventListener('click', () => { current -= 1; render(); });
        next.addEventListener('click', () => { current += 1; render(); });
        function loadCards() {
            cards = [
                { question: 'Explain definitions of security.', answer: '<ul><li><strong>Harrison, Ruzzo, and Ullman:</strong> security prevents access by unauthorized users.</li><li><strong>Garfinkel and Spafford:</strong> a computer is secure when you can depend on its software to behave as expected.</li><li><strong>Course definition:</strong> a system is secure if it maintains well-specified properties despite the actions of well-specified adversaries. A complete claim identifies the participant, conditions, and time period.</li></ul>' },
                { question: 'Define adversary, trust, threat, and security models.', answer: '<ul><li><strong>Adversary:</strong> anybody attempting to circumvent security infrastructure; state what the adversary can access, observe, modify, or control.</li><li><strong>Trust:</strong> the degree to which an entity is expected to behave in the system.</li><li><strong>Threat model:</strong> a description of relevant threats, adversaries, capabilities, and assumptions.</li><li><strong>Trust model:</strong> a description of who is trusted to do what in a particular environment.</li><li><strong>Security model:</strong> the combination of a trust model and a threat model that addresses perceived risks.</li></ul>' },
                { question: 'Provide a definition you encountered in class for the term “security model.”', answer: '<p>A security model identifies the assets and properties that must be protected; participants and trust assumptions; adversaries and capabilities; vulnerabilities and threats; and the defenses that preserve the required properties.</p>' },
                { question: 'A security model consists of which other models?', answer: '<p><strong>Trust model + Threat model = Security model</strong></p>' },
                { question: 'Define confidentiality, integrity, availability, asset, participant, vulnerability, threat, attack, defense, TCB, and risk.', answer: '<ul><li><strong>Confidentiality:</strong> prevent unauthorized disclosure of information.</li><li><strong>Integrity:</strong> prevent unauthorized modification of data, software, configuration, or behavior.</li><li><strong>Availability:</strong> preserve authorized access to information or services.</li><li><strong>Asset:</strong> something worth protecting, such as data, money, systems, access, or reputation.</li><li><strong>Participant:</strong> an expected system entity or viewpoint.</li><li><strong>Vulnerability:</strong> a flaw or condition that exposes a system to harm.</li><li><strong>Threat:</strong> a possible danger that may exploit a vulnerability.</li><li><strong>Attack:</strong> an attempt to exploit a vulnerability.</li><li><strong>Defense:</strong> a control or countermeasure that reduces the potential or impact of an attack.</li><li><strong>TCB:</strong> Trusted Computing Base, the components critical to system security.</li><li><strong>Risk:</strong> expected concern from likelihood, vulnerability, and impact: R = T × V × C, or R = P × C when probability is combined.</li><li><strong>Instructor caveat:</strong> ATM risk comparisons are somewhat meaningless without comparable scenarios, assumptions, and control costs.</li></ul>' },
                { question: 'Would you say a participant in a security model is limited to the actual people involved?', answer: '<p><strong>No.</strong> A participant is an expected system entity or viewpoint. Computers, agents, servers, clients, organizations, and hosts can be participants.</p>' },
                { question: 'Define the 3 components of the CIA triad.', answer: '<ul><li><strong>Confidentiality:</strong> prevent unauthorized disclosure of information.</li><li><strong>Integrity:</strong> prevent unauthorized modification of data, software, configuration, or behavior.</li><li><strong>Availability:</strong> preserve authorized access to information or services.</li></ul>' },
                { question: 'Is a broken window in your server room considered under the term “threat”?', answer: '<p><strong>No.</strong> The broken window is a <strong>vulnerability</strong> because it is a weakness or condition that exposes the system. An intruder is a possible <strong>threat</strong>; entering through the window is an <strong>attack</strong>.</p>' },
                { question: 'What does TCB stand for?', answer: '<p><strong>Trusted Computing Base:</strong> the components critical to system security.</p>' },
                { question: 'Identify common attacker types, four attack archetypes, and five defense archetypes.', answer: '<ul><li><strong>Common adversaries:</strong> curious or clueless users, script kiddies, people with an axe to grind, organized criminals, competitors, and governments or nation-state actors.</li><li><strong>Attack archetypes:</strong> interception, modification, fabrication, and interruption.</li><li><strong>Defense archetypes:</strong> prevention, deterrence, deflection, detection, and recovery.</li></ul>' },
                { question: 'List and define at least 3 out of the five archetype defenses discussed in the lecture.', answer: '<ul><li><strong>Prevention:</strong> block an attack or close a vulnerability.</li><li><strong>Deterrence:</strong> make an attack harder or less attractive.</li><li><strong>Deflection:</strong> make this target less desirable.</li><li><strong>Detection:</strong> identify an attack and respond.</li><li><strong>Recovery:</strong> restore after an attack or failure.</li></ul>' },
                { question: 'What attack archetypes match a ransomware scenario where an attacker encrypts files, interrupting dependent services?', answer: '<p><strong>Modification</strong>, because the files are changed, and <strong>interruption</strong>, because normal access to the files and dependent services is blocked.</p>' },
                { question: 'Differentiate the concepts of trusted and trustworthy.', answer: '<ul><li><strong>Trusted:</strong> a component whose failure can break the security policy; system security depends on it.</li><li><strong>Trustworthy:</strong> a component that has reason or assurance to be expected to behave correctly under stated conditions.</li></ul>' },
                { question: 'For an ATM on Glenwood Ave., is its operating system trusted or trustworthy? Why?', answer: '<p>The ATM operating system is <strong>trusted</strong> because the ATM depends on it for security-critical work. It is not automatically <strong>trustworthy</strong>; that requires evidence that it will behave correctly.</p>' },
                { question: 'Create and articulate security models for well-understood systems.', answer: '<p>Identify the assets and properties to protect; participants and trust assumptions; adversaries and capabilities; vulnerabilities and threats; and defenses that preserve the required properties.</p>' },
                { question: 'For the Glenwood Avenue ATM, what factors would you consider for a security model in terms of threats and trust?', answer: '<ul><li><strong>Assets and properties:</strong> PINs, account information, transaction records, balances, cash, software, and authorized access; protect confidentiality, integrity, availability, and atomic withdrawals.</li><li><strong>Participants and trust:</strong> customers, the bank, the ATM, payment networks, and maintenance staff.</li><li><strong>TCB:</strong> the operating system, firmware and boot chain, transaction software, cryptographic keys, hardware protections, and bank authorization service.</li><li><strong>Adversaries and capabilities:</strong> thieves, skimmer operators, technically skilled attackers, fraudsters with stolen credentials, malicious insiders, and environmental events.</li><li><strong>Vulnerabilities, threats, attacks, and defenses:</strong> identify the weaknesses and controls relevant to credential theft, fraudulent withdrawals, transaction modification, and service interruption.</li></ul>' },
                { question: 'Would installing ATM number pads upside down be a good approach to deter PIN theft? What are better solutions to shoulder surfing?', answer: '<p>Changing the keypad layout may slightly deter casual shoulder surfing, but it harms usability and determined observers can learn the layout. Better controls include physical PIN shields, privacy-aware ATM placement, camera and tamper monitoring, anti-skimming inspections, transaction alerts, and strong fraud detection.</p>' },
                { question: 'Define the principle of adequate protection.', answer: '<p>Protect assets to a degree consistent with their value. More protection is not automatically better because controls cost money, performance, usability, time, and complexity. A defense is justified when its cost is lower than the expected loss it prevents.</p>' }
            ];
            render();
        }
        loadCards();
    </script>
</body>

</html>
